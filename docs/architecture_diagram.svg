<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="910" viewBox="0 0 1280 910" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Arquitectura — PostgreSQL DWH Layered Architecture + Apache Airflow</title>
  <defs>
    <marker id="arrowData" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowCtl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <marker id="arrowDag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E7D4F"/>
    </marker>
  </defs>

  <!-- Fondo -->
  <rect x="0" y="0" width="1280" height="910" fill="#FFFFFF"/>

  <!-- ===================== Encabezado ===================== -->
  <text x="30" y="46" font-size="26" font-weight="700" fill="#0F172A">Arquitectura — PostgreSQL DWH Layered Architecture</text>
  <text x="30" y="72" font-size="14" fill="#64748B">Docker Compose · red dwh_network · pipeline Python (src/) orquestado con Apache Airflow</text>

  <!-- ===================== Orquestación ===================== -->
  <rect x="30" y="95" width="860" height="195" rx="14" fill="#EEF4FF" stroke="#3B6FD8" stroke-width="1.5"/>
  <text x="50" y="124" font-size="15" font-weight="700" fill="#1E3A8A">Orquestación · Apache Airflow 2.9.1 (LocalExecutor)</text>

  <g font-size="12.5">
    <rect x="50" y="140" width="190" height="62" rx="9" fill="#FFFFFF" stroke="#3B6FD8"/>
    <text x="145" y="166" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">airflow-webserver</text>
    <text x="145" y="187" text-anchor="middle" fill="#475569">UI · localhost:8080</text>

    <rect x="260" y="140" width="190" height="62" rx="9" fill="#FFFFFF" stroke="#3B6FD8"/>
    <text x="355" y="166" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">airflow-scheduler</text>
    <text x="355" y="187" text-anchor="middle" fill="#475569">programa y ejecuta los tasks</text>

    <rect x="470" y="140" width="190" height="62" rx="9" fill="#FFFFFF" stroke="#3B6FD8"/>
    <text x="565" y="166" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">airflow-metadata</text>
    <text x="565" y="187" text-anchor="middle" fill="#475569">PostgreSQL 16 · separada</text>

    <rect x="680" y="140" width="190" height="62" rx="9" fill="#FFFFFF" stroke="#3B6FD8" stroke-dasharray="5 4"/>
    <text x="775" y="166" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">airflow-init</text>
    <text x="775" y="187" text-anchor="middle" fill="#475569">migra DB + admin (1 vez)</text>
  </g>

  <!-- DAGs -->
  <g font-size="13">
    <rect x="50" y="220" width="400" height="50" rx="25" fill="#FDECEC" stroke="#D14343" stroke-width="1.5"/>
    <text x="250" y="241" text-anchor="middle" font-weight="700" fill="#991B1B">DAG dwh_init · manual</text>
    <text x="250" y="259" text-anchor="middle" fill="#991B1B">⚠ DESTRUCTIVO: DROP SCHEMA … CASCADE + DDL</text>

    <rect x="470" y="220" width="400" height="50" rx="25" fill="#E8F6EE" stroke="#2E7D4F" stroke-width="1.5"/>
    <text x="670" y="241" text-anchor="middle" font-weight="700" fill="#14532D">DAG dwh_pipeline · @daily</text>
    <text x="670" y="259" text-anchor="middle" fill="#14532D">carga completa + validación de conteos</text>
  </g>

  <!-- ===================== Otros servicios ===================== -->
  <rect x="910" y="95" width="340" height="195" rx="14" fill="#F6F7F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="930" y="124" font-size="15" font-weight="700" fill="#334155">Otros servicios</text>
  <g font-size="12.5">
    <rect x="930" y="140" width="300" height="58" rx="9" fill="#FFFFFF" stroke="#94A3B8"/>
    <text x="1080" y="164" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">pgadmin</text>
    <text x="1080" y="184" text-anchor="middle" fill="#475569">UI de PostgreSQL · localhost:5050</text>

    <rect x="930" y="212" width="300" height="58" rx="9" fill="#FFFFFF" stroke="#94A3B8" stroke-dasharray="5 4"/>
    <text x="1080" y="236" text-anchor="middle" font-size="14" font-weight="600" fill="#0F172A">etl · profile "manual"</text>
    <text x="1080" y="256" text-anchor="middle" fill="#475569">mismo pipeline por CLI, sin Airflow</text>
  </g>

  <!-- ===================== Conexiones de control ===================== -->
  <line x1="670" y1="290" x2="670" y2="336" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowCtl)"/>
  <text x="682" y="318" font-size="12.5" fill="#475569">PythonOperator → src/ → psycopg2</text>
  <line x1="1080" y1="290" x2="1080" y2="336" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowCtl)"/>
  <text x="1092" y="318" font-size="12.5" fill="#475569">SQL</text>

  <!-- ===================== Fuente: CSV ===================== -->
  <rect x="30" y="392" width="170" height="186" rx="12" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.5"/>
  <!-- Ícono de archivos -->
  <g fill="#FFFFFF" stroke="#6B7280" stroke-width="1.3">
    <path d="M92,410 h26 l10,10 v34 h-36 z"/>
    <path d="M100,418 h26 l10,10 v34 h-36 z"/>
  </g>
  <text x="115" y="494" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">data/</text>
  <text x="115" y="516" text-anchor="middle" font-size="12.5" fill="#475569">10 archivos CSV</text>
  <text x="115" y="536" text-anchor="middle" font-size="12.5" fill="#475569">Latin1 · separador , o ;</text>
  <text x="115" y="556" text-anchor="middle" font-size="12.5" fill="#475569">montado read-only</text>

  <!-- ===================== DWH (PostgreSQL 17) ===================== -->
  <rect x="230" y="340" width="1020" height="270" rx="14" fill="#F8FAFC" stroke="#334155" stroke-width="1.5"/>
  <text x="250" y="368" font-size="15" font-weight="700" fill="#0F172A">dwh_postgres · PostgreSQL 17 · localhost:5432 · base data_engineering</text>

  <!-- Capa 1: landing_zone -->
  <rect x="250" y="390" width="220" height="190" rx="10" fill="#E9F7EF" stroke="#1F9D55" stroke-width="1.5"/>
  <path d="M250,426 v-26 a10,10 0 0 1 10,-10 h200 a10,10 0 0 1 10,10 v26 z" fill="#1F9D55"/>
  <text x="360" y="414" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">CAPA 1 · landing_zone</text>
  <g font-size="13" fill="#14532D" text-anchor="middle">
    <text x="360" y="458" font-weight="600">10 tablas raw_*</text>
    <text x="360" y="482">columnas TEXT (datos crudos)</text>
    <text x="360" y="506">TRUNCATE + COPY</text>
    <text x="360" y="530">en cada carga</text>
  </g>

  <!-- Capa 2: staging -->
  <rect x="520" y="390" width="240" height="190" rx="10" fill="#FFF6DD" stroke="#C98A00" stroke-width="1.5"/>
  <path d="M520,426 v-26 a10,10 0 0 1 10,-10 h220 a10,10 0 0 1 10,10 v26 z" fill="#C98A00"/>
  <text x="640" y="414" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">CAPA 2 · staging</text>
  <g font-size="13" fill="#713F12" text-anchor="middle">
    <text x="640" y="458" font-weight="600">10 tablas stg_*</text>
    <text x="640" y="482">datos tipados y limpios</text>
    <text x="640" y="506">auditoría: created_at, updated_at</text>
    <text x="640" y="530">soft delete: is_deleted, deleted_at</text>
  </g>

  <!-- Capa 3: transformation (reservada) -->
  <rect x="800" y="390" width="140" height="92" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="870" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#64748B">CAPA 3</text>
  <text x="870" y="440" text-anchor="middle" font-size="13" fill="#64748B">transformation</text>
  <text x="870" y="462" text-anchor="middle" font-size="12.5" font-style="italic" fill="#94A3B8">(reservada)</text>

  <!-- Capa 4: service -->
  <rect x="980" y="390" width="250" height="190" rx="10" fill="#FFF1E6" stroke="#E0701A" stroke-width="1.5"/>
  <path d="M980,426 v-26 a10,10 0 0 1 10,-10 h230 a10,10 0 0 1 10,10 v26 z" fill="#E0701A"/>
  <text x="1105" y="414" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">CAPA 4 · service (DWH)</text>
  <g font-size="13" fill="#7C2D12" text-anchor="middle">
    <text x="1105" y="454" font-weight="600">Star Schema</text>
    <text x="1105" y="477">8 dimensiones dim_*</text>
    <text x="1105" y="500">3 hechos fact_*</text>
    <text x="1105" y="530" font-size="12.5">ventas 46.645 · compras 11.539</text>
    <text x="1105" y="551" font-size="12.5">gastos 8.640</text>
  </g>

  <!-- Flechas de datos -->
  <line x1="200" y1="485" x2="248" y2="485" stroke="#334155" stroke-width="2.2" marker-end="url(#arrowData)"/>
  <rect x="203" y="464" width="42" height="16" rx="4" fill="#FFFFFF"/>
  <text x="224" y="476" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">COPY</text>

  <line x1="470" y1="485" x2="518" y2="485" stroke="#334155" stroke-width="2.2" marker-end="url(#arrowData)"/>
  <text x="494" y="476" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">MERGE</text>
  <text x="494" y="502" text-anchor="middle" font-size="11" fill="#475569">3 casos</text>

  <line x1="760" y1="540" x2="978" y2="540" stroke="#334155" stroke-width="2.2" marker-end="url(#arrowData)"/>
  <text x="870" y="528" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">MERGE</text>
  <text x="870" y="560" text-anchor="middle" font-size="11" fill="#475569">dimensiones → hechos</text>

  <!-- ===================== DAG dwh_pipeline ===================== -->
  <rect x="30" y="640" width="1220" height="170" rx="14" fill="#F0FAF4" stroke="#2E7D4F" stroke-width="1.5"/>
  <text x="50" y="668" font-size="15" font-weight="700" fill="#14532D">DAG dwh_pipeline — un task por paso, tal como se ve en la UI de Airflow</text>

  <g font-size="12.5" text-anchor="middle">
    <!-- 1 -->
    <rect x="50" y="688" width="168" height="58" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="1.5"/>
    <text x="134" y="712" font-size="13.5" font-weight="700" fill="#0F172A">verificar_csvs</text>
    <text x="134" y="731" fill="#475569">existen los 10 CSV</text>
    <!-- 2 -->
    <rect x="252" y="688" width="168" height="58" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="1.5"/>
    <text x="336" y="712" font-size="13.5" font-weight="700" fill="#0F172A">cargar_landing</text>
    <text x="336" y="731" fill="#475569">CSV → landing_zone</text>
    <!-- 3 (TaskGroup) -->
    <rect x="460" y="694" width="168" height="58" rx="10" fill="#DCEFE3" stroke="#2E7D4F"/>
    <rect x="454" y="688" width="168" height="58" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="1.5"/>
    <text x="538" y="712" font-size="13.5" font-weight="700" fill="#0F172A">staging</text>
    <text x="538" y="731" fill="#475569">10 MERGE en orden</text>
    <!-- 4 (TaskGroup) -->
    <rect x="662" y="694" width="168" height="58" rx="10" fill="#DCEFE3" stroke="#2E7D4F"/>
    <rect x="656" y="688" width="168" height="58" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="1.5"/>
    <text x="740" y="712" font-size="13.5" font-weight="700" fill="#0F172A">dimensiones</text>
    <text x="740" y="731" fill="#475569">7 MERGE en paralelo</text>
    <!-- 5 (TaskGroup) -->
    <rect x="864" y="694" width="168" height="58" rx="10" fill="#DCEFE3" stroke="#2E7D4F"/>
    <rect x="858" y="688" width="168" height="58" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="1.5"/>
    <text x="942" y="712" font-size="13.5" font-weight="700" fill="#0F172A">hechos</text>
    <text x="942" y="731" fill="#475569">3 MERGE tras las dims</text>
    <!-- 6 -->
    <rect x="1062" y="688" width="168" height="58" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="1.5"/>
    <text x="1146" y="712" font-size="13.5" font-weight="700" fill="#0F172A">validar_conteos</text>
    <text x="1146" y="731" fill="#475569">raw = stg · hechos OK</text>
  </g>
  <g stroke="#2E7D4F" stroke-width="2" marker-end="url(#arrowDag)">
    <line x1="218" y1="717" x2="250" y2="717"/>
    <line x1="420" y1="717" x2="452" y2="717"/>
    <line x1="628" y1="717" x2="654" y2="717"/>
    <line x1="830" y1="717" x2="856" y2="717"/>
    <line x1="1032" y1="717" x2="1060" y2="717"/>
  </g>
  <text x="50" y="788" font-size="12.5" fill="#14532D">Cajas apiladas = TaskGroup · retries=1 · max_active_runs=1 · catchup=False · si un servicio de src/ devuelve False, el task lanza una excepción y queda en rojo</text>

  <!-- ===================== Leyenda ===================== -->
  <g font-size="12.5" fill="#475569">
    <line x1="30" y1="858" x2="70" y2="858" stroke="#334155" stroke-width="2.2" marker-end="url(#arrowData)"/>
    <text x="80" y="862">flujo de datos</text>
    <line x1="190" y1="858" x2="230" y2="858" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowCtl)"/>
    <text x="240" y="862">control / conexión</text>
    <rect x="375" y="849" width="36" height="18" rx="5" fill="#FFFFFF" stroke="#94A3B8" stroke-dasharray="5 4"/>
    <text x="420" y="862">corre a demanda / reservado</text>
    <text x="620" y="862">Volúmenes: pgdata · airflow-metadata-pgdata · airflow-logs · dwh-logs · pgadmin-data</text>
  </g>
</svg>
